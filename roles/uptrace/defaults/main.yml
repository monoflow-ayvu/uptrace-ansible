uptrace_version: '2.0.0-beta.2'
uptrace_license: ''
uptrace_dsn: ''

ingest_url: '{{ site_url }}'

listen_http_addr: ':80'
listen_grpc_addr: ':4317'

auth_disabled: false
auth_sign_up_disabled: false
auth_sign_in_disabled: false

certmagic_enabled: false
certmagic_staging_ca: false
telegram_bot_token: ''

seed_data: {}

redis_db: 0
# ClickHouse native protocol port. The clickhouse-server role serves the plain
# port (9000) and does not enable the TLS-secured port (9440), so connect plainly.
# To use 9440, enable tcp_port_secure + certs in the clickhouse-server role and
# set ch_tls accordingly.
ch_port: 9000
ch_tls: null
