[databases]
{{ pg_db_name }} = host={{ pg_hba_addrs[inventory_hostname] | first }} port=5432 dbname={{ pg_db_name }}

[pgbouncer]
# Literal IPs resolved at deploy time (see pg_hba_addrs in tasks/main.yml);
# a hostname here makes PgBouncer startup depend on DNS and it aborts if
# resolution fails.
listen_addr = {{ pg_hba_addrs[inventory_hostname] | join(',') }}
listen_port = 6543
unix_socket_dir = /var/run/postgresql
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

server_connect_timeout = 3
server_login_retry = 1
query_wait_timeout = 5

logfile = /var/log/postgresql/pgbouncer.log
pidfile = /var/run/postgresql/pgbouncer.pid

pool_mode = transaction
max_client_conn = 1000
default_pool_size = {{ ansible_processor_vcpus }}
