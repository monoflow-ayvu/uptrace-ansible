# DO NOT DISABLE!
# If you change this first entry you will need to make sure that the
# database superuser can access the database using some other method.
# Noninteractive access to all databases is required during automatic
# maintenance (custom daily cronjobs, replication, and similar tasks).
#
# Database administrative login by Unix domain socket
local   all             postgres                                peer

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# "local" is for Unix domain socket connections only
local   all             all                                     peer

# Addresses are resolved in tasks/main.yml so that inventory entries may be
# either IPs or DNS names; each resolved address gets a /32 (IPv4) or /128 (IPv6).
# replication
{% for host in groups.postgresql %}
{% for addr in pg_hba_addrs[host] | default([]) %}
host replication replicator {{ addr }}/{{ 128 if ':' in addr else 32 }} trust
{% endfor %}
{% endfor %}

# PgBouncer and otel (the PostgreSQL host itself)
{% for addr in pg_hba_addrs[inventory_hostname] | default([]) %}
host all {{ pg_db_user }} {{ addr }}/{{ 128 if ':' in addr else 32 }} md5
{% endfor %}

# uptrace
{% for host in groups.uptrace %}
{% for addr in pg_hba_addrs[host] | default([]) %}
host {{ pg_db_name }} {{ pg_db_user }} {{ addr }}/{{ 128 if ':' in addr else 32 }} md5
{% endfor %}
{% endfor %}
